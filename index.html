<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>Stevscon</title>

  <!-- Favicon con tu logo oficial (guiones bajos) -->
  <link rel="icon" type="image/png" href="SC-LOGO-20260825013121.png">
  <link rel="apple-touch-icon" href="SC-LOGO-20260825013121.png">

  <!-- Meta tags para SEO y compatibilidad -->
  <meta name="description" content="Stevscon - Plataforma interactiva y comunidad">
  <meta name="theme-color" content="#0d0b14">

  <!-- Estilos base -->
  <link rel="stylesheet" href="styles.css">

  <!-- Font Awesome para iconografía -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 1) SDK oficial de Firebase (Compat v9.x) -->
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- 2) Configuración e inicialización propia de Firebase -->
  <script defer src="firebase_data.js"></script>

  <!-- 3) Categoría Accounts: memoria y roles -->
  <script defer src="Accounts/accounts_manager/memory_acc.js"></script>
  <script defer src="Accounts/accounts_manager/owner.js"></script>
  <script defer src="Accounts/accounts_manager/admin.js"></script>

  <!-- 4) Lógica funcional (func_acc) -->
  <script defer src="Accounts/accounts_manager/func_acc/func_errors.js"></script>
  <script defer src="Accounts/accounts_manager/func_acc/func_auth.js"></script>
  <script defer src="Accounts/accounts_manager/func_acc/func_sessions.js"></script>
  <script defer src="Accounts/accounts_manager/func_acc/func_buttons.js"></script>

  <!-- 5) Interfaz de usuario (ui_acc) -->
  <script defer src="Accounts/accounts_manager/ui_acc/ui_errors.js"></script>
  <script defer src="Accounts/accounts_manager/ui_acc/ui_auth.js"></script>
  <script defer src="Accounts/accounts_manager/ui_acc/ui_buttons.js"></script>
  <script defer src="Accounts/accounts_manager/ui_acc/ui_sessions.js"></script>
</head>

<body class="theme-dark">

  <!-- Contenedor global de alertas y notificaciones (lo usa ui_errors.js) -->
  <div id="alerts-container" class="alerts-wrapper" aria-live="polite"></div>

  <!-- Barra de Navegación Principal -->
  <header class="navbar">
    <div class="brand">
      <img src="SC_LOGO_20260825013121.png" alt="Stevscon Logo" class="brand-logo" id="main-brand-logo">
      <span class="brand-title">Stevscon</span>
    </div>

    <nav class="header-nav" id="main-nav">
      <!-- Botones de navegación por categorías -->
      <button class="nav-btn active" data-category="home" title="Inicio">
        <i class="fa-solid fa-house"></i>
        <span class="nav-label">Inicio</span>
      </button>
      <button class="nav-btn" data-category="friends" title="Amigos">
        <i class="fa-solid fa-user-group"></i>
        <span class="nav-label">Amigos</span>
        <span id="badge-friend-requests" class="nav-badge hidden">0</span>
      </button>
      <button class="nav-btn" data-category="messages" title="Mensajes">
        <i class="fa-solid fa-comments"></i>
        <span class="nav-label">Mensajes</span>
        <span id="badge-unread-messages" class="nav-badge hidden">0</span>
      </button>
    </nav>

    <!-- Zona derecha: 100% dinámica. ui_buttons.js dibuja aquí
         el botón "Iniciar Sesión" o la tarjeta del usuario logueado -->
    <div class="auth-header" id="user-header-actions"></div>
  </header>

  <!-- Área de Contenido Dinámico / Pantallas -->
  <main id="app-main-viewport" class="main-viewport">
    <!-- Vista Inicial / Home -->
    <section id="view-home" class="view-section active">
      <div class="welcome-container">
        <h1>Bienvenido a Stevscon</h1>
        <p>Tu plataforma social, mensajería y comunidad en tiempo real.</p>
      </div>
    </section>

    <!-- Vista de Amigos -->
    <section id="view-friends" class="view-section hidden">
      <div id="friends-container" class="module-container">
        <!-- Renderizado dinámico por ui_friends.js -->
      </div>
    </section>

    <!-- Vista de Mensajes / MDs -->
    <section id="view-messages" class="view-section hidden">
      <div id="messages-container" class="module-container messages-layout">
        <!-- Renderizado dinámico por ui_messages.js -->
      </div>
    </section>

    <!-- Vista de Perfil -->
    <section id="view-profile" class="view-section hidden">
      <div id="profile-container" class="module-container">
        <!-- Renderizado dinámico por ui_profile.js -->
      </div>
    </section>
  </main>

  <!-- Contenedor para Modales (Auth, Confirmaciones) — lo usan ui_auth.js y ui_errors.js -->
  <div id="modals-root" class="modals-wrapper"></div>

</body>
</html>
