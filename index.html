<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stevscon.com</title>
    
    <!-- Icono de la Pestaña del Navegador (Favicon) -->
    <link rel="icon" type="image/png" href="SC-LOGO-20260825013121.png">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navegación Principal -->
    <header class="navbar">
        <div id="auth-header-section" class="auth-header"></div>

        <a href="#" class="brand" onclick="regresarASocial(); return false;">
            <img src="SC-LOGO-20260825013121.png" alt="Stevscon Logo" class="brand-logo" onerror="this.style.display='none'">
            <span>Stevscon.com</span>
        </a>
    </header>

    <!-- Contenedor Principal -->
    <main class="main-container" id="app-root"></main>

    <!-- CDNs Externos -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Utilidades -->
    <script src="fonts.js"></script>

    <!-- 1. Módulos Base de Datos y Permisos (Requeridos primero) -->
    <script src="accounts_manage/memory_acc.js"></script>
    <script src="accounts_manage/owner.js"></script>
    <script src="accounts_manage/admin.js"></script>
    <script src="accounts_manage/account_func/func_bot.js"></script>
    <script src="accounts_manage/account_func/func_auth.js"></script>

    <!-- 2. Interfaz de Usuario -->
    <script src="accounts_manage/accounts_ui/ui_alerts.js"></script>
    <script src="accounts_manage/accounts_ui/ui_buttons.js"></script>
    <script src="accounts_manage/accounts_ui/ui_auth.js"></script>

    <!-- 3. Sistema de Perfiles -->
    <script src="profile/profile_memory.js"></script>
    <script src="profile/func_profile/func_profile.js"></script>
    <script src="profile/func_profile/func_friends.js"></script>
    <script src="profile/func_profile/func_messages.js"></script>
    <script src="profile/ui_profile/ui_profile.js"></script>
    <script src="profile/ui_profile/ui_friends.js"></script>
    <script src="profile/ui_profile/ui_messages.js"></script>

    <!-- 4. Enrutador Principal -->
    <script src="category.js"></script>
</body>
</html>
