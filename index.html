<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stevscon.com</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="SC-LOGO-20260825013121.png">

  <!-- Estilos -->
  <link rel="stylesheet" href="styles.css">

  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK (Compat v9.x) -->
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

  <!-- Configuración de Firebase -->
  <script defer src="firebase_data.js"></script>
</head>
<body class="theme-dark">

  <!-- Barra de Navegación Superior -->
  <header class="navbar">
    <div class="brand">
      <img src="SC-LOGO-20260825013121.png" alt="Stevscon Logo" class="brand-logo" id="main-brand-logo">
      <span class="brand-title">Stevscon.com</span>
    </div>

    <!-- Zona para acciones del usuario (Inicio de sesión) -->
    <div class="auth-header" id="user-header-actions"></div>
  </header>

  <!-- Contenedor Principal Vacío -->
  <main id="app-main-viewport" class="main-viewport">
  </main>

  <!-- Contenedor para Alertas y Modales -->
  <div id="alerts-container" class="alerts-wrapper"></div>
  <div id="modals-root" class="modals-wrapper"></div>

</body>
</html>
