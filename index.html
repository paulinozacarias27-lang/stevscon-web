  <!-- Autodiagnóstico: si la web no arranca, dice en pantalla qué file falta -->
  <script>
  window.addEventListener('load', function () {
    setTimeout(function () {
      var main = document.getElementById('app-main-viewport');
      if (!main || main.childNodes.length > 0) return; // todo bien, la web arrancó
      var missing = [];
      if (!window.StevsconRanks) missing.push('owner.js / admin.js');
      if (!window.StevsconFirebase) missing.push('firebase_data.js');
      if (!window.StevsconCreate) missing.push('los módulos de accounts/');
      if (!window.StevsconCreate || !window.StevsconCreate.output) missing.push('category_acc.js o los campos output');
      var box = document.createElement('div');
      box.style.cssText = 'margin:60px auto;max-width:540px;padding:20px 24px;border:1px solid #ef4444;' +
        'border-radius:10px;color:#f87171;font-family:Inter,sans-serif;font-size:14px;text-align:center;' +
        'background:rgba(239,68,68,.08)';
      box.textContent = 'La web no arrancó. Revisa que existan y se llamen EXACTO: ' +
        (missing.join(' · ') || 'category_acc.js') +
        '. Pulsa F12 > Console para ver el error exacto.';
      main.appendChild(box);
    }, 1500);
  });
  </script>
