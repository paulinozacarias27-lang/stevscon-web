    sección (mc_formats, mc_core, mc_system, mc_page, mc_manage,

    edit_page, mc_categorys, mc_sub_categorys, mc_likes).
  - Firebase IDÉNTICO al resto: SDKs 9.23.0 + firebase_data.js.

<style>

    .mc-hero{background:linear-gradient(135deg,rgba(74,222,128,.22),rgba(22,163,74,.10));border:1px solid var(--border-color);border-radius:20px;padding:34px 28px;text-align:center;margin-bottom:22px}
    .mc-hero h1{margin:0;font-size:34px;letter-spacing:-.02em}
    .mc-hero .mc-tld{color:var(--mc-accent)}
    .mc-hero-sub{color:var(--text-muted);font-weight:600;font-size:14px;max-width:560px;margin:8px auto 16px}
    .mc-hero.mc-hero-img{padding:0;background:none;overflow:hidden}
    .mc-hero-banner{display:block;width:100%;height:auto}
    .mc-stats{display:flex;gap:9px;align-items:baseline;justify-content:center}
    .mc-stats strong{font-size:26px;color:var(--mc-accent)}
    .mc-stats span{font:800 10px Inter,sans-serif;letter-spacing:.16em;color:var(--text-muted);padding-top:6px}
    .mc-stats i{color:var(--border-color);font-style:normal}
    .mc-about{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:18px 20px;margin-bottom:26px}
    .mc-about p{margin:8px 0 0;color:var(--text-muted);font-size:13.5px;font-weight:600;line-height:1.7}

    .mc-sec{margin-bottom:30px}
    .mc-sec h2{display:flex;align-items:center;gap:9px;font-size:17px;margin:0 0 13px}
    .mc-sec h2 i{color:var(--mc-accent);font-size:14px}
    .mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}
    .mc-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px}
    .mc-card:hover{border-color:var(--mc-accent);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
    .mc-card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .mc-type{display:inline-flex;align-items:center;gap:6px;font:800 9.5px Inter,sans-serif;letter-spacing:.1em;color:var(--text-muted);background:var(--bg-hover);border:1px solid var(--border-color);border-radius:999px;padding:3px 9px}
    .mc-type i{font-size:9px}
    .mc-type-proyecto{color:#22c55e}.mc-type-devlog{color:#60a5fa}.mc-type-easter{color:#f59e0b}.mc-type-guia{color:#86efac}
    .mc-feat{display:inline-flex;align-items:center;gap:5px;font:800 9.5px Inter,sans-serif;letter-spacing:.1em;color:var(--gold);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.45);border-radius:999px;padding:3px 9px}
    .mc-card h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
    .mc-card-sum{margin:0;color:var(--text-muted);font-size:12.5px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .mc-card-meta{display:flex;gap:7px;align-items:center;color:var(--text-muted);font:600 11px Inter,sans-serif;flex-wrap:wrap}

    .mc-catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
    .mc-catcard{--cat-color:var(--mc-accent);display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:16px;cursor:pointer;color:var(--text-main);font-family:Inter,sans-serif;transition:.2s}
    .mc-catcard:hover{border-color:var(--cat-color);transform:translateY(-3px)}
    .mc-caticon{font-size:22px;background:color-mix(in srgb,var(--cat-color) 18%,transparent);border:1px solid color-mix(in srgb,var(--cat-color) 45%,transparent);border-radius:12px;padding:8px 10px;line-height:1}
    .mc-caticon.mc-big{font-size:30px;border-radius:16px}
    .mc-catname{font-weight:800;font-size:14px}
    .mc-catcount{color:var(--text-muted);font:600 11px Inter,sans-serif}
    .mc-cathead{display:flex;align-items:center;gap:14px;margin-bottom:20px}

    .mc-article{background:var(--bg-card);border:1px solid var(--border-color);border-radius:18px;padding:26px 28px}
    .mc-art-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .mc-catlink{border:1px solid var(--border-color);background:var(--bg-hover);color:var(--text-muted);border-radius:999px;padding:4px 11px;font:700 11px Inter,sans-serif;cursor:pointer}
    .mc-catlink:hover{color:var(--mc-accent);border-color:var(--mc-accent)}
    .mc-editbtn{margin-left:auto;border:1px solid var(--mc-accent);background:rgba(74,222,128,.12);color:var(--mc-accent);border-radius:999px;padding:5px 13px;font:800 11px Inter,sans-serif;cursor:pointer}
    .mc-editbtn:hover{background:var(--mc-accent);color:#06210f}
    .mc-art-title{margin:0 0 6px;font-size:27px;letter-spacing:-.02em}
    .mc-art-sum{margin:0 0 14px;color:var(--text-muted);font-weight:600;font-size:14px;line-height:1.6}
    .mc-art-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);margin-bottom:16px;color:var(--text-muted);font:600 12px Inter,sans-serif}
    .mc-author{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--text-main);cursor:pointer;padding:0;font:700 12.5px Inter,sans-serif}
    .mc-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--mc-dark);display:flex;align-items:center;justify-content:center;font:800 12px Inter,sans-serif;color:#06210f}
    .mc-cover{margin:0 0 16px;border-radius:14px;overflow:hidden;border:1px solid var(--border-color)}
    .mc-cover img{width:100%;display:block;max-height:380px;object-fit:cover}

    .mc-body{line-height:1.75;font-size:14.5px}
    .mc-body h2{margin:20px 0 8px;font-size:20px;padding-bottom:6px;border-bottom:1px solid var(--border-color)}
    .mc-body h3{margin:16px 0 6px;font-size:16px;color:#bbf7d0}
    .mc-body p{margin:9px 0}
    .mc-body ul,.mc-body ol{margin:9px 0;padding-left:24px}
    .mc-body li{margin:4px 0}
    .mc-body blockquote{margin:12px 0;border-left:3px solid var(--mc-accent);background:rgba(74,222,128,.08);border-radius:0 10px 10px 0;padding:9px 14px;color:var(--text-muted);font-weight:600}
    .mc-body code{background:var(--bg-hover);border:1px solid var(--border-color);border-radius:6px;padding:1.5px 6px;font-size:12.5px;color:#fbbf24}
    .mc-body hr{border:0;border-top:1px solid var(--border-color);margin:18px 0}
    .mc-body img{border-radius:12px;border:1px solid var(--border-color)}

    .mc-hist-list{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:6px 16px}
    .mc-hist-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border-color);font:600 12.5px Inter,sans-serif}
    .mc-hist-row:last-child{border-bottom:0}
    .mc-hist-row i{color:var(--mc-accent);font-size:11px}
    .mc-hist-txt{flex:1}
    .mc-hist-date{color:var(--text-muted);font-size:11.5px}
    .mc-hist-empty,.mc-search-count{color:var(--text-muted);font:600 12.5px Inter,sans-serif}
    .mc-empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
    .mc-empty i{font-size:38px;color:var(--mc-dark);margin-bottom:12px;display:block}
    .mc-empty h3{margin:0 0 6px;color:var(--text-main)}
    .mc-empty p{margin:0;font-weight:600;font-size:13px}

    :root{
        --bg-main:#0b120e; --bg-card:#111a13; --border-color:#1f3527; --bg-hover:#18251b;
        --mc-accent:#4ade80; --mc-dark:#16a34a; --mc-glow:rgba(74,222,128,.35);
        --gold:#f59e0b; --text-main:#f8fafc; --text-muted:#94a3b8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--bg-main);color:var(--text-main);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    a{color:var(--mc-accent);text-decoration:none}
    img{max-width:100%}

    #mc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg-main);z-index:300}
    #mc-boot .mc-boot-face{width:64px;height:64px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#4ade80,#16a34a);display:grid;place-items:center}
    #mc-boot .mc-boot-face img{width:100%;height:100%;object-fit:cover;display:block}
    #mc-boot .mc-boot-fb{display:none;place-items:center;width:100%;height:100%;color:#06210f;font:800 20px Inter,sans-serif}
    #mc-boot .mc-boot-logo{font-size:26px;font-weight:800;letter-spacing:-.02em}
    #mc-boot .mc-boot-logo span{color:var(--mc-accent)}
    #mc-boot .mc-boot-hint{color:var(--text-muted);font-size:13px;font-weight:600}
    .mc-boot-spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--bg-hover);border-top-color:var(--mc-accent);animation:mc-spin .7s linear infinite}
    @keyframes mc-spin{to{transform:rotate(360deg)}}
    #mc-boot .mc-boot-error{display:none;max-width:620px;margin:0 20px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#f87171;border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;line-height:1.7;text-align:left;white-space:pre-line}

    .mc-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:0 18px;height:60px;background:rgba(11,18,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color)}
    .mc-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--text-main);flex:none;cursor:pointer}
    .mc-brand img{width:34px;height:34px;border-radius:10px;object-fit:cover}
    .mc-brand .mc-brand-fb{display:none;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4ade80,#16a34a);color:#06210f;font:800 13px Inter,sans-serif}
    .mc-brand .mc-tld{color:var(--mc-accent)}
    .mc-search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:999px;padding:8px 16px;transition:border-color .2s}
    .mc-search:focus-within{border-color:var(--mc-accent)}
    .mc-search i{color:var(--text-muted);font-size:13px}
    .mc-search input{flex:1;background:none;border:0;outline:0;color:var(--text-main);font:600 13.5px Inter,sans-serif}
    .mc-search input::placeholder{color:var(--text-muted)}
    .mc-back{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-main);border-radius:999px;padding:8px 15px;font:700 12px Inter,sans-serif;cursor:pointer;transition:.2s}
    .mc-back:hover{border-color:var(--mc-accent);color:var(--mc-accent)}

    #mc-catnav{position:sticky;top:60px;z-index:99;padding:0 18px;background:rgba(11,18,14,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color)}
    .mcc-bar{display:flex;align-items:center;gap:2px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
    .mcc-wrap{position:relative}
    .mcc-item{display:flex;align-items:center;gap:8px;padding:14px 13px 11px;border:0;border-bottom:3px solid transparent;background:none;color:var(--text-muted);font:800 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s}
    .mcc-item .mcc-ico{font-size:13px}
    .mcc-item:hover{color:var(--text-main)}
    .mcc-item.is-active{color:var(--text-main);border-bottom-color:var(--mc-accent)}
    .mcc-item.is-open{color:var(--mc-accent)}
    .mcc-caret{font-size:9px;margin-left:2px;transition:transform .18s}
    .mcc-item.is-open .mcc-caret{transform:rotate(180deg)}
    .mcc-count{margin-left:auto;padding-left:14px;color:var(--text-muted);font:800 10.5px Inter,sans-serif;letter-spacing:.16em;white-space:nowrap}
    .mcc-drop{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.5);padding:12px;z-index:130;animation:mcc-drop-in .16s ease;text-align:left}
    @keyframes mcc-drop-in{from{opacity:0;transform:translateX(-50%) translateY(-6px)}}
    .mcc-viewall{display:flex;align-items:center;gap:9px;width:100%;border:0;background:linear-gradient(135deg,rgba(74,222,128,.16),rgba(22,163,74,.10));color:var(--mc-accent);border-radius:10px;padding:10px 12px;font:800 12.5px Inter,sans-serif;cursor:pointer}
    .mcc-viewall:hover{background:linear-gradient(135deg,var(--mc-accent),var(--mc-dark));color:#06210f}
    .mcc-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px}
    .mcc-col h4{margin:2px 0 6px;color:var(--text-muted);font:800 10px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase}
    .mcc-link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:7px 9px;color:var(--text-main);font:600 13px Inter,sans-serif;cursor:pointer}
    .mcc-link:hover{background:var(--bg-hover)}
    .mcc-linkico{width:20px;text-align:center;font-size:12px;color:var(--text-muted)}
    .mcc-linktxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mcc-link small{color:var(--text-muted);font:600 11px Inter,sans-serif;white-space:nowrap}
    .mcc-empty{margin:4px 9px;color:var(--text-muted);font:600 12px Inter,sans-serif}
    .mcc-dropfoot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:1px solid var(--border-color)}
    .mcc-addbtn{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--mc-accent);background:rgba(74,222,128,.10);color:var(--mc-accent);border-radius:999px;padding:6px 13px;font:800 11.5px Inter,sans-serif;cursor:pointer}
    .mcc-addbtn:hover{background:var(--mc-accent);color:#06210f;border-style:solid}
    @media(max-width:640px){.mcc-cols{grid-template-columns:1fr}.mcc-item{padding:11px 10px 9px;font-size:11px}}

    .mc-subbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-2px 0 20px}
    .mc-subchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-muted);border-radius:999px;padding:6px 13px;font:700 12px Inter,sans-serif;cursor:pointer;transition:.2s}
    .mc-subchip:hover{color:var(--text-main);border-color:var(--mc-accent)}
    .mc-subchip.is-active{background:linear-gradient(135deg,var(--mc-accent),var(--mc-dark));border-color:transparent;color:#06210f}
    .mc-subchip small{font:600 10.5px Inter,sans-serif;opacity:.8}
    .mc-subchip.add{border-style:dashed;color:var(--mc-accent);border-color:var(--mc-accent)}
    .mc-subhead{flex-wrap:wrap}
    .mc-subhead .mc-subcrumb{width:100%;margin-bottom:2px}
    .mc-subcrumb{display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--mc-accent);font:800 12px Inter,sans-serif;cursor:pointer;padding:0}
    .mc-subcrumb:hover{text-decoration:underline}
    .mc-subcount{margin:2px 0 16px;color:var(--text-muted);font:600 12.5px Inter,sans-serif}
    .mc-subtools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
    html[data-theme="light"] .mcc-drop{box-shadow:0 24px 60px rgba(20,40,28,.18)}

    #mc-main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}

    #mc-toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;gap:8px;align-items:center}
    .mc-toast{display:flex;align-items:center;gap:9px;background:var(--bg-card);border:1px solid var(--border-color);border-left:3px solid var(--mc-accent);color:var(--text-main);border-radius:12px;padding:11px 16px;font:600 13px Inter,sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.55);animation:mc-in .25s ease}
    .mc-toast.err{border-left-color:#ef4444}
    .mc-toast.ok{border-left-color:#22c55e}
    @keyframes mc-in{from{opacity:0;transform:translateY(10px)}}

    @media (max-width:720px){
        .mc-header{gap:9px;padding:0 12px}
        .mc-brand .mc-txt{display:none}
        .mc-back span{display:none}
        #mc-main{padding:18px 12px 70px}
    }

    html[data-theme="light"]{
        --bg-main:#e6f4ea; --bg-card:#f4fbf6; --border-color:#c3e2cd; --bg-hover:#dcefe2;
        --mc-accent:#16a34a; --mc-dark:#15803d; --mc-glow:rgba(22,163,74,.18);
        --gold:#b45309; --text-main:#12211a; --text-muted:#4f6b5b;
    }
    html[data-theme="light"] body{background:#e6f4ea;color:#12211a}
    html[data-theme="light"] .mc-header{background:rgba(230,244,234,.92)}
    html[data-theme="light"] #mc-catnav{background:rgba(230,244,234,.9)}
    html[data-theme="light"] .mc-card:hover,
    html[data-theme="light"] .mc-catcard:hover{box-shadow:0 12px 30px rgba(20,40,28,.14)}
    html[data-theme="light"] .mc-body h3{color:#15803d}
    html[data-theme="light"] .mc-body code{color:#b45309}
    html[data-theme="light"] .mc-type-guia{color:#15803d}
    html[data-theme="light"] .mc-toast{box-shadow:0 14px 40px rgba(20,40,28,.18)}
</style>

<script>
(function () {
    var meta = document.querySelector('meta[name="theme-color"]');
    function paint(v) {
        document.documentElement.setAttribute('data-theme', v);
        if (meta) meta.setAttribute('content', v === 'light' ? '#e6f4ea' : '#0b120e');
    }
    var t = 'dark';
    try { t = localStorage.getItem('stevscon_theme') || 'dark'; } catch (e) {}
    paint(t);
    document.addEventListener('sc:theme-applied', function (e) {
        var v = (e && e.detail && e.detail.theme) || 'dark';
        paint(v);
        try { localStorage.setItem('stevscon_theme', v); } catch (er) {}
    });
    window.addEventListener('storage', function (e) {
        if (e.key === 'stevscon_theme' && (e.newValue === 'light' || e.newValue === 'dark')) paint(e.newValue);
    });
})();
</script>

<script>
    window.__mcDiag = { jsErrors: [], failed: {} };
    window.addEventListener('error', function (e) {
        if (e && e.target && e.target.tagName === 'SCRIPT') return;
        window.__mcDiag.jsErrors.push(e && e.message ? e.message : String(e && e.error ? e.error : e));
    }, true);
</script>

<script>
    try {
        if (typeof firebase !== 'undefined' && !firebase.apps.length &&
            window.StevsconFirebase && window.StevsconFirebase.apiKey) {
            firebase.initializeApp(window.StevsconFirebase);
        }
    } catch (e) { console.warn('[Minecraft] Firebase config:', e && e.message); }

    window.StevsconMC = window.StevsconMC || {};
    window.StevsconMC.toast = function (msg, kind) {
        var wrap = document.getElementById('mc-toasts');
        if (!wrap) return;
        var t = document.createElement('div');
        t.className = 'mc-toast' + (kind === 'error' ? ' err' : kind === 'ok' ? ' ok' : '');
        var ic = document.createElement('i');
        ic.className = kind === 'error' ? 'fa-solid fa-circle-exclamation' : kind === 'ok' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-info';
        var sp = document.createElement('span');
        sp.textContent = msg;
        t.appendChild(ic); t.appendChild(sp);
        wrap.appendChild(t);
        setTimeout(function () {
            t.style.opacity = '0'; t.style.transition = 'opacity .3s';
            setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
        }, 4200);
    };
</script>

<script>
(function () {
    'use strict';
    var boot = document.getElementById('mc-boot');
    var booted = false;
    var hidden = false;

    document.addEventListener('sc:open-profile', function (e) {
        if (e && e.detail && e.detail.handled) return;
        if (e && e.detail) e.detail.handled = true;
        if (window.StevsconMC && window.StevsconMC.toast) {
            window.StevsconMC.toast('El panel de perfiles vive en Stevscon.com', 'info');
        }
    });

    function getBootFn(W) {
        if (!W) return null;
        if (typeof W.boot === 'function') return W.boot;
        if (W.core && typeof W.core.boot === 'function') return W.core.boot;
        if (W.page && typeof W.page.boot === 'function') return W.page.boot;
        return null;
    }

    function coreReady() {
        var W = window.StevsconMC;
        return !!(W && W.formats && W.core && W.system && W.manage && W.store && W.storeManage && getBootFn(W));
    }

    function hideBoot() {
        if (hidden || !boot) return;
        hidden = true;
        boot.style.transition = 'opacity .25s ease';
        boot.style.opacity = '0';
        setTimeout(function () { boot.style.display = 'none'; }, 260);
    }

    function fail() {
        var W = window.StevsconMC || {};
        var diag = window.__mcDiag || { jsErrors: [], failed: {} };
        var L = ['StevsMCross no pudo arrancar. Diagnóstico:'];

        [['mc_formats.js',        function (w) { return !!(w && w.formats); }, '/minecraft/manage/output/'],
         ['mc_core.js',           function (w) { return !!(w && w.core); }, '/minecraft/manage/output/'],
         ['mc_system.js',         function (w) { return !!(w && w.system); }, '/minecraft/manage/output/'],
         ['mc_page.js',           function (w) { return !!(w && typeof w.boot === 'function'); }, '/minecraft/manage/pages/'],
         ['mc_manage.js',         function (w) { return !!(w && w.manage); }, '/minecraft/manage/output/'],
         ['mc_subs_system.js',    function (w) { return !!(w && w.subsSystem); }, '/minecraft/manage/output/'],
         ['mc_subs.js',           function (w) { return !!(w && w.subs); }, '/minecraft/manage/output/'],
         ['mc_subs_manage.js',    function (w) { return !!(w && w.subsManage); }, '/minecraft/manage/output/'],
         ['mc_store.js',          function (w) { return !!(w && w.store); }, '/minecraft/manage/output/'],
         ['mc_store_manage.js',   function (w) { return !!(w && w.storeManage); }, '/minecraft/manage/output/'],
         ['edit_page.js',         function (w) { return !!(w && w.homeblocks); }, '/minecraft/manage/pages/'],
         ['mc_categorys.js',      function (w) { return !!(w && w.catsNav); }, '/minecraft/manage/pages/'],
         ['mc_sub_categorys.js',  function (w) { return !!(w && w.subcats); }, '/minecraft/manage/pages/'],
         ['mc_likes.js',          function () { return true; }, '/minecraft/manage/output/'],
        ].forEach(function (r) {
            if (diag.failed[r[0]]) {
                L.push('✘ ' + r[0] + ': NO SE ENCONTRÓ (404). Revisa nombre y carpeta EXACTOS: ' + r[2] + r[0]);
            } else if (r[1](W)) {
                L.push('✔ ' + r[0] + ': cargó bien.');
            } else {
                L.push('⚠ ' + r[0] + ': el file cargó pero quedó vacío/incompleto o es una versión vieja (caché). Vuelve a pegar el contenido correcto y recarga con Ctrl+Shift+R.');
            }
        });

        if (diag.jsErrors && diag.jsErrors.length) {
            L.push('Error de JS capturado: ' + diag.jsErrors[0]);
        }

        var box = document.getElementById('mc-boot-error');
        if (box) {
            box.textContent = L.join('\n');
            box.style.display = 'block';
        }
        var spin = boot && boot.querySelector('.mc-boot-spin');
        var hint = boot && boot.querySelector('.mc-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Algo falló:';
    }

    document.addEventListener('sc:mc-ready', hideBoot);

    function tryBoot() {
        if (booted) return true;
        var W = window.StevsconMC;
        if (!coreReady()) return false;
        booted = true;
        try {
            getBootFn(W).call(W);
        } catch (e) {
            console.error('[Minecraft] boot():', e);
            if (window.__mcDiag) window.__mcDiag.jsErrors.unshift('boot(): ' + (e && e.message ? e.message : e));
            fail();
            return true;
        }
        var n = 0;
        (function look() {
            if (hidden) return;
            var main = document.getElementById('mc-main');
            if ((main && main.childNodes.length > 0) || ++n > 40) return hideBoot();
            setTimeout(look, 200);
        })();
        return true;
    }

    var tries = 0;
    (function waitCore() {
        if (tryBoot()) return;
        if (++tries > 75) return fail();
        setTimeout(waitCore, 200);
    })();

    console.log('[Minecraft] minecraft.html v1 lista — motor de StevsMCross integrado.');
})();
</script>
