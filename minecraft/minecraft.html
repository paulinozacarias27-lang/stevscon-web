    edit_page, mc_categorys, mc_sub_categorys, mc_likes).
  - Firebase IDÉNTICO al resto: SDKs 9.23.0 + firebase_data.js.
  - Tema claro/oscuro compartido (stevscon_theme + sc:theme-applied).
  - Namespace global: window.StevsconMC (MC).
  ====
-->
<html lang="es">
<head>

<title>StevsMCross</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


<style>

    .mc-hero{position:relative;border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),7px 7px 0 rgba(0,0,0,.45);background:linear-gradient(180deg,#3b2d1f 0,#33271b 35%,#2a2015 100%);padding:40px 28px 30px;text-align:center;margin-bottom:26px}
    .mc-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:16px;background:repeating-linear-gradient(90deg,#6abe30 0 14px,#5aa427 14px 22px,#66b62d 22px 32px,#4f9422 32px 40px);border-bottom:3px solid #000}
    .mc-hero h1{margin:0;font:400 23px/1.6 var(--px-font);text-shadow:3px 3px 0 #142608}
    .mc-hero .mc-tld{color:var(--mc-accent)}
    .mc-hero-sub{color:var(--text-muted);font:600 14px/1.6 var(--ui-font);max-width:560px;margin:10px auto 16px}
    .mc-hero.mc-hero-img{padding:0;background:none}
    .mc-hero-banner{display:block;width:100%;height:auto}
    .mc-stats{display:flex;gap:9px;align-items:baseline;justify-content:center;margin-top:6px}
    .mc-stats strong{font:400 18px var(--px-font);color:var(--gold);text-shadow:2px 2px 0 #142608}
    .mc-stats span{font:700 10px var(--ui-font);letter-spacing:.16em;color:var(--text-muted);padding-top:6px}
    .mc-stats i{color:var(--border-color);font-style:normal}
    .mc-about{background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),5px 5px 0 rgba(0,0,0,.4);padding:18px 20px;margin-bottom:26px}
    .mc-about p{margin:8px 0 0;color:var(--text-muted);font:600 13.5px/1.7 var(--ui-font)}

    .mc-sec{margin-bottom:30px}
    .mc-sec h2{display:flex;align-items:center;gap:9px;font:400 13px var(--px-font);margin:0 0 15px;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
    .mc-sec h2 i{color:var(--mc-accent);font-size:14px}
    .mc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}
    .mc-card{position:relative;background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),5px 5px 0 rgba(0,0,0,.4);padding:15px 16px;cursor:pointer;transition:transform .1s,box-shadow .1s;display:flex;flex-direction:column;gap:8px}
    .mc-card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:repeating-linear-gradient(90deg,var(--mc-accent) 0 8px,var(--mc-dark) 8px 16px);opacity:0;transition:opacity .12s}
    .mc-card:hover{transform:translate(-2px,-2px);box-shadow:0 0 0 2px var(--gold),8px 8px 0 rgba(0,0,0,.45)}
    .mc-card:hover::before{opacity:1}
    .mc-card:active{transform:translate(2px,2px);box-shadow:0 0 0 2px var(--border-color),2px 2px 0 rgba(0,0,0,.4)}
    .mc-card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .mc-type{display:inline-flex;align-items:center;gap:6px;font:700 9.5px var(--ui-font);letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);background:var(--bg-hover);border:2px solid #000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.08),inset -1px -1px 0 rgba(0,0,0,.4);border-radius:0;padding:3px 8px}
    .mc-type i{font-size:9px}
    .mc-type-proyecto{color:#7fdc3a}.mc-type-devlog{color:#60a5fa}.mc-type-easter{color:var(--gold)}.mc-type-guia{color:var(--diamond)}
    .mc-feat{display:inline-flex;align-items:center;gap:5px;font:700 9.5px var(--ui-font);letter-spacing:.08em;text-transform:uppercase;color:#1c1602;background:var(--gold);border:2px solid #000;box-shadow:inset 1px 1px 0 rgba(255,255,255,.4),inset -1px -1px 0 rgba(0,0,0,.35);border-radius:0;padding:3px 8px}
    .mc-card h3{margin:0;font:700 16px var(--ui-font)}
    .mc-card-sum{margin:0;color:var(--text-muted);font:600 12.5px/1.6 var(--ui-font);display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .mc-card-meta{display:flex;gap:7px;align-items:center;color:var(--text-muted);font:600 11px var(--ui-font);flex-wrap:wrap}

    .mc-catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
    .mc-catcard{--cat-color:var(--mc-accent);position:relative;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),5px 5px 0 rgba(0,0,0,.4);padding:16px;cursor:pointer;color:var(--text-main);font-family:var(--ui-font);transition:transform .1s,box-shadow .1s}
    .mc-catcard:hover{transform:translate(-2px,-2px);box-shadow:0 0 0 2px var(--cat-color),8px 8px 0 rgba(0,0,0,.45)}
    .mc-catcard:active{transform:translate(2px,2px);box-shadow:0 0 0 2px var(--border-color),2px 2px 0 rgba(0,0,0,.4)}
    .mc-caticon{font-size:22px;background:color-mix(in srgb,var(--cat-color) 18%,transparent);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.12),inset -2px -2px 0 rgba(0,0,0,.35);border-radius:0;padding:8px 10px;line-height:1}
    .mc-caticon.mc-big{font-size:30px}
    .mc-catname{font-weight:700;font-size:15px}
    .mc-catcount{color:var(--text-muted);font:600 11px var(--ui-font)}
    .mc-cathead{display:flex;align-items:center;gap:14px;margin-bottom:20px}

    .mc-article{background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),7px 7px 0 rgba(0,0,0,.4);padding:26px 28px}
    .mc-art-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .mc-catlink{border:2px solid #000;background:var(--bg-hover);box-shadow:inset 1px 1px 0 rgba(255,255,255,.1),inset -1px -1px 0 rgba(0,0,0,.4);color:var(--text-muted);border-radius:0;padding:4px 10px;font:700 11px var(--ui-font);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
    .mc-catlink:hover{color:var(--mc-accent);border-color:var(--mc-accent)}
    .mc-editbtn{margin-left:auto;border:3px solid #000;background:var(--mc-dark);box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.4);color:#eaf7dd;border-radius:0;padding:6px 14px;font:700 11px var(--ui-font);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
    .mc-editbtn:hover{background:var(--mc-accent);color:#16300a}
    .mc-editbtn:active{transform:translate(2px,2px);box-shadow:inset -2px -2px 0 rgba(255,255,255,.2),inset 2px 2px 0 rgba(0,0,0,.45)}
    .mc-art-title{margin:0 0 6px;font:400 18px/1.7 var(--px-font);text-shadow:3px 3px 0 rgba(0,0,0,.55);word-break:break-word}
    .mc-art-sum{margin:0 0 14px;color:var(--text-muted);font:600 14px/1.6 var(--ui-font)}
    .mc-art-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:2px solid var(--border-color);border-bottom:2px solid var(--border-color);margin-bottom:16px;color:var(--text-muted);font:600 12px var(--ui-font)}
    .mc-author{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--text-main);cursor:pointer;padding:0;font:700 12.5px var(--ui-font)}
    .mc-avatar{width:28px;height:28px;border-radius:0;object-fit:cover;background:var(--mc-dark);border:2px solid #000;display:flex;align-items:center;justify-content:center;font:800 12px var(--ui-font);color:#eaf7dd}
    .mc-cover{margin:0 0 16px;border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),5px 5px 0 rgba(0,0,0,.4);overflow:hidden}
    .mc-cover img{width:100%;display:block;max-height:380px;object-fit:cover}

    .mc-body{line-height:1.75;font-size:14.5px}
    .mc-body h2{margin:20px 0 8px;font:400 15px/1.7 var(--px-font);padding-bottom:8px;border-bottom:3px solid var(--border-color)}
    .mc-body h3{margin:16px 0 6px;font:700 17px var(--ui-font);color:var(--diamond)}
    .mc-body p{margin:9px 0}
    .mc-body ul,.mc-body ol{margin:9px 0;padding-left:24px}
    .mc-body li{margin:4px 0}
    .mc-body blockquote{margin:12px 0;border:2px solid #000;border-left:6px solid var(--mc-accent);background:rgba(127,220,58,.08);padding:9px 14px;color:var(--text-muted);font-weight:600}
    .mc-body code{background:#0b0d09;border:2px solid var(--border-color);border-radius:0;padding:1.5px 6px;font-size:12.5px;color:var(--gold)}
    .mc-body hr{border:0;border-top:3px solid var(--border-color);margin:18px 0}
    .mc-body img{border-radius:0;border:3px solid #000;box-shadow:0 0 0 1px var(--border-color)}

    .mc-hist-list{background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),5px 5px 0 rgba(0,0,0,.4);padding:6px 16px}
    .mc-hist-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px solid var(--border-color);font:600 12.5px var(--ui-font)}
    .mc-hist-row:last-child{border-bottom:0}
    .mc-hist-row i{color:var(--mc-accent);font-size:11px}
    .mc-hist-txt{flex:1}
    .mc-hist-date{color:var(--text-muted);font-size:11.5px}
    .mc-hist-empty,.mc-search-count{color:var(--text-muted);font:600 12.5px var(--ui-font)}
    .mc-empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
    .mc-empty i{font-size:38px;color:var(--mc-dark);margin-bottom:12px;display:block}
    .mc-empty h3{margin:0 0 6px;color:var(--text-main);font:400 13px/1.8 var(--px-font)}
    .mc-empty p{margin:0;font-weight:600;font-size:13px}

    :root{
        --bg-main:#0e100d; --bg-card:#181c14; --border-color:#2f3626; --bg-hover:#232a1b;
        --mc-accent:#7fdc3a; --mc-dark:#4a8f1d; --mc-glow:rgba(127,220,58,.3);
        --gold:#f4c542; --diamond:#4aedd9; --redstone:#ff5545;
        --px-font:'Press Start 2P',monospace; --ui-font:'Pixelify Sans','Inter',sans-serif;
        --text-main:#eef4e6; --text-muted:#98a28c;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background-color:var(--bg-main);color:var(--text-main);font-family:var(--ui-font),system-ui,sans-serif;min-height:100vh;background-image:linear-gradient(45deg,rgba(255,255,255,.014) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.014) 75%),linear-gradient(45deg,rgba(0,0,0,.07) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.07) 75%);background-size:8px 8px;background-position:0 0,4px 4px}
    ::selection{background:var(--mc-accent);color:#12260a}
    a{color:var(--mc-accent);text-decoration:none}
    img{max-width:100%}
    ::-webkit-scrollbar{width:12px;height:12px}
    ::-webkit-scrollbar-track{background:var(--bg-main)}
    ::-webkit-scrollbar-thumb{background:var(--bg-hover);border:2px solid #000;box-shadow:inset 2px 2px 0 rgba(255,255,255,.1),inset -2px -2px 0 rgba(0,0,0,.4)}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

    #mc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background-color:var(--bg-main);background-image:linear-gradient(45deg,rgba(255,255,255,.02) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.02) 75%),linear-gradient(45deg,rgba(0,0,0,.09) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.09) 75%);background-size:8px 8px;background-position:0 0,4px 4px;z-index:300}
    #mc-boot .mc-boot-face{width:72px;height:72px;border-radius:0;overflow:hidden;border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),6px 6px 0 rgba(0,0,0,.45);background:linear-gradient(135deg,var(--mc-accent),var(--mc-dark));display:grid;place-items:center}
    #mc-boot .mc-boot-face img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated}
    #mc-boot .mc-boot-fb{display:none;place-items:center;width:100%;height:100%;color:#16300a;font:800 20px var(--ui-font)}
    #mc-boot .mc-boot-logo{font:400 19px var(--px-font);text-shadow:3px 3px 0 #142608}
    #mc-boot .mc-boot-logo span{color:var(--mc-accent)}
    #mc-boot .mc-boot-hint{color:var(--text-muted);font:600 14px var(--ui-font)}
    .mc-boot-spin{width:18px;height:18px;border:3px solid var(--bg-hover);border-top-color:var(--mc-accent);border-radius:0;animation:mc-spin .8s steps(8) infinite}
    @keyframes mc-spin{to{transform:rotate(360deg)}}
    #mc-boot .mc-boot-error{display:none;max-width:620px;margin:0 20px;border:3px solid #000;box-shadow:0 0 0 2px var(--redstone),6px 6px 0 rgba(0,0,0,.45);background:rgba(255,85,69,.08);color:#f87171;border-radius:0;padding:14px 16px;font:600 13px/1.7 var(--ui-font);text-align:left;white-space:pre-line}

    .mc-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:0 18px;height:62px;background:rgba(14,16,13,.97);border-bottom:3px solid #000;box-shadow:0 2px 0 var(--border-color)}
    .mc-brand{display:flex;align-items:center;gap:10px;font:400 13px var(--px-font);color:var(--text-main);flex:none;cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.6)}
    .mc-brand img{width:34px;height:34px;border-radius:0;object-fit:cover;border:2px solid #000;box-shadow:0 0 0 2px var(--border-color)}
    .mc-brand .mc-brand-fb{display:none;place-items:center;width:34px;height:34px;border-radius:0;border:2px solid #000;background:linear-gradient(135deg,var(--mc-accent),var(--mc-dark));color:#16300a;font:800 13px var(--ui-font)}
    .mc-brand .mc-tld{color:var(--mc-accent)}
    .mc-search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),inset 2px 2px 0 rgba(0,0,0,.4);border-radius:0;padding:7px 14px;transition:box-shadow .15s}
    .mc-search:focus-within{box-shadow:0 0 0 2px var(--gold),inset 2px 2px 0 rgba(0,0,0,.4)}
    .mc-search i{color:var(--text-muted);font-size:13px}
    .mc-search input{flex:1;background:none;border:0;outline:0;color:var(--text-main);font:600 14px var(--ui-font)}
    .mc-search input::placeholder{color:var(--text-muted)}
    .mc-back{flex:none;display:flex;align-items:center;gap:7px;border:3px solid #000;background:var(--bg-hover);box-shadow:inset 2px 2px 0 rgba(255,255,255,.12),inset -2px -2px 0 rgba(0,0,0,.45),3px 3px 0 rgba(0,0,0,.4);color:var(--text-main);border-radius:0;padding:7px 13px;font:700 12px var(--ui-font);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
    .mc-back:hover{background:var(--mc-dark);color:#eaf7dd}
    .mc-back:active{transform:translate(2px,2px);box-shadow:inset -2px -2px 0 rgba(255,255,255,.1),inset 2px 2px 0 rgba(0,0,0,.45)}

    #mc-catnav{position:sticky;top:62px;z-index:99;padding:0 14px;background:rgba(14,16,13,.97);border-bottom:3px solid #000;box-shadow:0 2px 0 var(--border-color)}
    .mcc-bar{display:flex;align-items:center;gap:4px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
    .mcc-wrap{position:relative}
    .mcc-item{display:flex;align-items:center;gap:8px;margin:7px 2px;padding:9px 12px;border:2px solid transparent;background:rgba(0,0,0,.3);box-shadow:inset 2px 2px 0 rgba(0,0,0,.45),inset -2px -2px 0 rgba(255,255,255,.05);color:var(--text-muted);font:700 11.5px var(--ui-font);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;border-radius:0;transition:color .12s,box-shadow .12s}
    .mcc-item .mcc-ico{font-size:13px}
    .mcc-item:hover{color:var(--text-main)}
    .mcc-item.is-active{color:#fff;border-color:var(--mc-accent);background:rgba(127,220,58,.12);box-shadow:0 0 0 2px #000,inset 2px 2px 0 rgba(255,255,255,.12),inset -2px -2px 0 rgba(0,0,0,.4)}
    .mcc-item.is-open{color:var(--mc-accent);border-color:var(--gold)}
    .mcc-caret{font-size:9px;margin-left:2px;transition:transform .18s}
    .mcc-item.is-open .mcc-caret{transform:rotate(180deg)}
    .mcc-count{margin-left:auto;padding-left:14px;color:var(--text-muted);font:700 10.5px var(--ui-font);letter-spacing:.14em;white-space:nowrap}
    .mcc-drop{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:var(--bg-card);border:3px solid #000;box-shadow:0 0 0 2px var(--border-color),10px 10px 0 rgba(0,0,0,.5);border-radius:0;padding:12px;z-index:130;animation:mcc-drop-in .16s;text-align:left}
    @keyframes mcc-drop-in{from{opacity:0;transform:translateX(-50%) translateY(-6px)}}
    .mcc-viewall{display:flex;align-items:center;gap:9px;width:100%;border:3px solid #000;background:var(--mc-dark);box-shadow:inset 2px 2px 0 rgba(255,255,255,.3),inset -2px -2px 0 rgba(0,0,0,.4);color:#eaf7dd;border-radius:0;padding:10px 12px;font:700 12px var(--ui-font);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
    .mcc-viewall:hover{background:var(--mc-accent);color:#16300a}
    .mcc-viewall:active{transform:translate(2px,2px)}
    .mcc-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px}
    .mcc-col h4{margin:2px 0 6px;color:var(--gold);font:700 10px var(--ui-font);letter-spacing:.14em;text-transform:uppercase}
    .mcc-link{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;border-radius:0;padding:7px 9px;color:var(--text-main);font:600 13px var(--ui-font);cursor:pointer}
    .mcc-link:hover{background:var(--bg-hover);box-shadow:inset 3px 0 0 var(--mc-accent)}
    .mcc-linkico{width:20px;text-align:center;font-size:12px;color:var(--text-muted)}
    .mcc-linktxt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mcc-link small{color:var(--text-muted);font:600 11px var(--ui-font);white-space:nowrap}
    .mcc-empty{margin:4px 9px;color:var(--text-muted);font:600 12px var(--ui-font)}
    .mcc-dropfoot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:10px;border-top:2px solid var(--border-color)}
    .mcc-addbtn{display:inline-flex;align-items:center;gap:7px;border:2px dashed var(--mc-accent);background:rgba(127,220,58,.08);color:var(--mc-accent);border-radius:0;padding:6px 12px;font:700 11.5px var(--ui-font);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
    .mcc-addbtn:hover{background:var(--mc-accent);color:#16300a;border-style:solid}

    .mc-subbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-2px 0 20px}

})();

        setTimeout(function () {
            t.style.opacity = '0'; t.style.transition = 'opacity .3s';
            setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);

<script>
(function () {
    'use strict';
    var boot = document.getElementById('mc-boot');
    var booted = false;
    var hidden = false;

    document.addEventListener('sc:open-profile', function (e) {
        if (e && e.detail && e.detail.handled) return;
        if (e && e.detail) e.detail.handled = true;
        if (window.StevsconMC && window.StevsconMC.toast) {
            window.StevsconMC.toast('El panel de perfiles vive en Stevscon.com', 'info');
        }
    });

    function getBootFn(W) {
        if (!W) return null;
        if (typeof W.boot === 'function') return W.boot;
        if (W.core && typeof W.core.boot === 'function') return W.core.boot;
        if (W.page && typeof W.page.boot === 'function') return W.page.boot;
        return null;
    }

    function coreReady() {
        var W = window.StevsconMC;
        return !!(W && W.formats && W.core && W.system && W.manage && W.store && W.storeManage && getBootFn(W));
    }

    function hideBoot() {
        if (hidden || !boot) return;
        hidden = true;
        boot.style.transition = 'opacity .25s ease';
        boot.style.opacity = '0';
        setTimeout(function () { boot.style.display = 'none'; }, 260);
    }

    function fail() {
        var W = window.StevsconMC || {};
        var diag = window.__mcDiag || { jsErrors: [], failed: {} };
        var L = ['StevsMCross no pudo arrancar. Diagnóstico:'];

        [['mc_formats.js',        function (w) { return !!(w && w.formats); }, '/minecraft/manage/output/'],
         ['mc_core.js',           function (w) { return !!(w && w.core); }, '/minecraft/manage/output/'],
         ['mc_system.js',         function (w) { return !!(w && w.system); }, '/minecraft/manage/output/'],
         ['mc_page.js',           function (w) { return !!(w && typeof w.boot === 'function'); }, '/minecraft/manage/pages/'],
         ['mc_manage.js',         function (w) { return !!(w && w.manage); }, '/minecraft/manage/output/'],
         ['mc_subs_system.js',    function (w) { return !!(w && w.subsSystem); }, '/minecraft/manage/output/'],
         ['mc_subs.js',           function (w) { return !!(w && w.subs); }, '/minecraft/manage/output/'],
         ['mc_subs_manage.js',    function (w) { return !!(w && w.subsManage); }, '/minecraft/manage/output/'],
         ['mc_store.js',          function (w) { return !!(w && w.store); }, '/minecraft/manage/output/'],
         ['mc_store_manage.js',   function (w) { return !!(w && w.storeManage); }, '/minecraft/manage/output/'],
         ['edit_page.js',         function (w) { return !!(w && w.homeblocks); }, '/minecraft/manage/pages/'],
         ['mc_categorys.js',      function (w) { return !!(w && w.catsNav); }, '/minecraft/manage/pages/'],
         ['mc_sub_categorys.js',  function (w) { return !!(w && w.subcats); }, '/minecraft/manage/pages/'],
         ['mc_likes.js',          function () { return true; }, '/minecraft/manage/output/'],
        ].forEach(function (r) {
            if (diag.failed[r[0]]) {
                L.push('✘ ' + r[0] + ': NO SE ENCONTRÓ (404). Revisa nombre y carpeta EXACTOS: ' + r[2] + r[0]);
            } else if (r[1](W)) {
                L.push('✔ ' + r[0] + ': cargó bien.');
            } else {
                L.push('⚠ ' + r[0] + ': el file cargó pero quedó vacío/incompleto o es una versión vieja (caché). Vuelve a pegar el contenido correcto y recarga con Ctrl+Shift+R.');
            }
        });

        if (diag.jsErrors && diag.jsErrors.length) {
            L.push('Error de JS capturado: ' + diag.jsErrors[0]);
        }

        var box = document.getElementById('mc-boot-error');
        if (box) {
            box.textContent = L.join('\n');
            box.style.display = 'block';
        }
        var spin = boot && boot.querySelector('.mc-boot-spin');
        var hint = boot && boot.querySelector('.mc-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Algo falló:';
    }

    document.addEventListener('sc:mc-ready', hideBoot);

    function tryBoot() {
        if (booted) return true;
        var W = window.StevsconMC;
        if (!coreReady()) return false;
        booted = true;
        try {
            getBootFn(W).call(W);
        } catch (e) {
            console.error('[Minecraft] boot():', e);
            if (window.__mcDiag) window.__mcDiag.jsErrors.unshift('boot(): ' + (e && e.message ? e.message : e));
            fail();
            return true;
        }
        var n = 0;
        (function look() {
            if (hidden) return;
            var main = document.getElementById('mc-main');
            if ((main && main.childNodes.length > 0) || ++n > 40) return hideBoot();
            setTimeout(look, 200);
        })();
        return true;
    }

    var tries = 0;
    (function waitCore() {
        if (tryBoot()) return;
        if (++tries > 75) return fail();
        setTimeout(waitCore, 200);
    })();

    console.log('[Minecraft] minecraft.html v2 lista — motor de StevsMCross integrado.');
})();
</script>
