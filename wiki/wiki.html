<!DOCTYPE html>
<!--
  ====
  STEVSCON.WIKI — wiki/wiki.html (v1)
  Página HTML propia de la categoría WIKI.
  URL: https://www.stevscon.com/wiki/wiki.html
  - Layout estilo Fandom a tu estilo: header fijo (logo + buscador +
    Volver), barra de categorías, portada con banner, "N PAGES",
    destacados y artículos con historial de ediciones.
  - Lectura pública; edición SOLO staff/owner (wiki_manage.js).
  - Deep links: #a/{slug|id}  #c/{slug categoría}  #s/{búsqueda}
  - Aquí NO se carga category_wiki.js — la puerta vive en el index.
  ====
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0b14">
<title>Stevscon.wiki</title>
<link rel="icon" type="image/png" href="/SC-LOGO-20260825013121.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>

    /* ---- Portada ---- */
    .wk-hero{background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(109,40,217,.10));border:1px solid var(--border-color);border-radius:20px;padding:34px 28px;text-align:center;margin-bottom:22px}
    .wk-hero h1{margin:0;font-size:34px;letter-spacing:-.02em}
    .wk-hero .wk-tld{color:var(--purple-accent)}
    .wk-hero-sub{color:var(--text-muted);font-weight:600;font-size:14px;max-width:560px;margin:8px auto 16px}
    .wk-stats{display:flex;gap:9px;align-items:baseline;justify-content:center}
    .wk-stats strong{font-size:26px;color:var(--purple-accent)}
    .wk-stats span{font:800 10px Inter,sans-serif;letter-spacing:.16em;color:var(--text-muted);padding-top:6px}
    .wk-stats i{color:var(--border-color);font-style:normal}
    .wk-about{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:18px 20px;margin-bottom:26px}
    .wk-about p{margin:8px 0 0;color:var(--text-muted);font-size:13.5px;font-weight:600;line-height:1.7}

    /* ---- Secciones y tarjetas ---- */
    .wk-sec{margin-bottom:30px}
    .wk-sec h2{display:flex;align-items:center;gap:9px;font-size:17px;margin:0 0 13px}
    .wk-sec h2 i{color:var(--purple-accent);font-size:14px}
    .wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}
    .wk-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:15px 16px;cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:8px}
    .wk-card:hover{border-color:var(--purple-accent);transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.4)}
    .wk-card-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .wk-type{display:inline-flex;align-items:center;gap:6px;font:800 9.5px Inter,sans-serif;letter-spacing:.1em;color:var(--text-muted);background:var(--bg-hover);border:1px solid var(--border-color);border-radius:999px;padding:3px 9px}
    .wk-type i{font-size:9px}
    .wk-type-proyecto{color:#22c55e}.wk-type-devlog{color:#60a5fa}.wk-type-easter{color:#f59e0b}.wk-type-guia{color:#a78bfa}
    .wk-feat{display:inline-flex;align-items:center;gap:5px;font:800 9.5px Inter,sans-serif;letter-spacing:.1em;color:var(--gold);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.45);border-radius:999px;padding:3px 9px}
    .wk-card h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
    .wk-card-sum{margin:0;color:var(--text-muted);font-size:12.5px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .wk-card-meta{display:flex;gap:7px;align-items:center;color:var(--text-muted);font:600 11px Inter,sans-serif;flex-wrap:wrap}

    /* ---- Tarjetas de categoría ---- */
    .wk-catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:13px}
    .wk-catcard{--cat-color:var(--purple-accent);display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:16px;cursor:pointer;color:var(--text-main);font-family:Inter,sans-serif;transition:.2s}
    .wk-catcard:hover{border-color:var(--cat-color);transform:translateY(-3px)}
    .wk-caticon{font-size:22px;background:color-mix(in srgb,var(--cat-color) 18%,transparent);border:1px solid color-mix(in srgb,var(--cat-color) 45%,transparent);border-radius:12px;padding:8px 10px;line-height:1}
    .wk-caticon.wk-big{font-size:30px;border-radius:16px}
    .wk-catname{font-weight:800;font-size:14px}
    .wk-catcount{color:var(--text-muted);font:600 11px Inter,sans-serif}
    .wk-cathead{display:flex;align-items:center;gap:14px;margin-bottom:20px}

    /* ---- Artículo ---- */
    .wk-article{background:var(--bg-card);border:1px solid var(--border-color);border-radius:18px;padding:26px 28px}
    .wk-art-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .wk-catlink{border:1px solid var(--border-color);background:var(--bg-hover);color:var(--text-muted);border-radius:999px;padding:4px 11px;font:700 11px Inter,sans-serif;cursor:pointer}
    .wk-catlink:hover{color:var(--purple-accent);border-color:var(--purple-accent)}
    .wk-editbtn{margin-left:auto;border:1px solid var(--purple-accent);background:rgba(139,92,246,.12);color:var(--purple-accent);border-radius:999px;padding:5px 13px;font:800 11px Inter,sans-serif;cursor:pointer}
    .wk-editbtn:hover{background:var(--purple-accent);color:#fff}
    .wk-art-title{margin:0 0 6px;font-size:27px;letter-spacing:-.02em}
    .wk-art-sum{margin:0 0 14px;color:var(--text-muted);font-weight:600;font-size:14px;line-height:1.6}
    .wk-art-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);margin-bottom:16px;color:var(--text-muted);font:600 12px Inter,sans-serif}
    .wk-author{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--text-main);cursor:pointer;padding:0;font:700 12.5px Inter,sans-serif}
    .wk-avatar{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--purple-dark);display:flex;align-items:center;justify-content:center;font:800 12px Inter,sans-serif;color:#fff}
    .wk-cover{margin:0 0 16px;border-radius:14px;overflow:hidden;border:1px solid var(--border-color)}
    .wk-cover img{width:100%;display:block;max-height:380px;object-fit:cover}

    /* ---- Markdown del cuerpo ---- */
    .wk-body{line-height:1.75;font-size:14.5px}
    .wk-body h2{margin:20px 0 8px;font-size:20px;padding-bottom:6px;border-bottom:1px solid var(--border-color)}
    .wk-body h3{margin:16px 0 6px;font-size:16px;color:#c4b5fd}
    .wk-body p{margin:9px 0}
    .wk-body ul,.wk-body ol{margin:9px 0;padding-left:24px}
    .wk-body li{margin:4px 0}
    .wk-body blockquote{margin:12px 0;border-left:3px solid var(--purple-accent);background:rgba(139,92,246,.08);border-radius:0 10px 10px 0;padding:9px 14px;color:var(--text-muted);font-weight:600}
    .wk-body code{background:var(--bg-hover);border:1px solid var(--border-color);border-radius:6px;padding:1.5px 6px;font-size:12.5px;color:#fbbf24}
    .wk-body hr{border:0;border-top:1px solid var(--border-color);margin:18px 0}
    .wk-body img{border-radius:12px;border:1px solid var(--border-color)}

    /* ---- Historial / varios ---- */
    .wk-hist-list{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:6px 16px}
    .wk-hist-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border-color);font:600 12.5px Inter,sans-serif}
    .wk-hist-row:last-child{border-bottom:0}
    .wk-hist-row i{color:var(--purple-accent);font-size:11px}
    .wk-hist-txt{flex:1}
    .wk-hist-date{color:var(--text-muted);font-size:11.5px}
    .wk-hist-empty,.wk-search-count{color:var(--text-muted);font:600 12.5px Inter,sans-serif}
    .wk-empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
    .wk-empty i{font-size:38px;color:var(--purple-dark);margin-bottom:12px;display:block}
    .wk-empty h3{margin:0 0 6px;color:var(--text-main)}
    .wk-empty p{margin:0;font-weight:600;font-size:13px}
    
    :root{
        --bg-main:#0d0b14; --bg-card:#16121f; --border-color:#2e2440; --bg-hover:#261f36;
        --purple-accent:#8b5cf6; --purple-dark:#6d28d9; --purple-glow:rgba(139,92,246,.35);
        --gold:#f59e0b; --text-main:#f8fafc; --text-muted:#94a3b8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--bg-main);color:var(--text-main);font-family:Inter,system-ui,sans-serif;min-height:100vh}
    a{color:var(--purple-accent);text-decoration:none}
    img{max-width:100%}

    /* ---- Pantalla de arranque ---- */
    #wk-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg-main);z-index:300}
    #wk-boot .wk-boot-logo{font-size:26px;font-weight:800;letter-spacing:-.02em}
    #wk-boot .wk-boot-logo span{color:var(--purple-accent)}
    #wk-boot .wk-boot-hint{color:var(--text-muted);font-size:13px;font-weight:600}
    .wk-boot-spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--bg-hover);border-top-color:var(--purple-accent);animation:wk-spin .7s linear infinite}
    @keyframes wk-spin{to{transform:rotate(360deg)}}
    #wk-boot .wk-boot-error{display:none;max-width:540px;margin:0 20px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#f87171;border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;line-height:1.6}

    /* ---- Header fijo ---- */
    .wk-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:0 18px;height:60px;background:rgba(13,11,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color)}
    .wk-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--text-main);flex:none;cursor:pointer}
    .wk-brand img{width:34px;height:34px;border-radius:10px;object-fit:cover}
    .wk-brand .wk-tld{color:var(--purple-accent)}
    .wk-search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:999px;padding:8px 16px;transition:border-color .2s}
    .wk-search:focus-within{border-color:var(--purple-accent)}
    .wk-search i{color:var(--text-muted);font-size:13px}
    .wk-search input{flex:1;background:none;border:0;outline:0;color:var(--text-main);font:600 13.5px Inter,sans-serif}
    .wk-search input::placeholder{color:var(--text-muted)}
    .wk-back{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-main);border-radius:999px;padding:8px 15px;font:700 12px Inter,sans-serif;cursor:pointer;transition:.2s}
    .wk-back:hover{border-color:var(--purple-accent);color:var(--purple-accent)}

    /* ---- Barra de categorías ---- */
    #wk-catnav{position:sticky;top:60px;z-index:99;display:flex;gap:8px;align-items:center;padding:10px 18px;background:rgba(13,11,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-color);overflow-x:auto;scrollbar-width:none}
    #wk-catnav::-webkit-scrollbar{display:none}
    .wk-chip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-muted);font:700 12px Inter,sans-serif;cursor:pointer;transition:.2s;white-space:nowrap}
    .wk-chip:hover{color:var(--text-main);border-color:var(--purple-accent)}
    .wk-chip.is-active{background:linear-gradient(135deg,var(--purple-accent),var(--purple-dark));border-color:transparent;color:#fff}

    /* ---- Main ---- */
    #wk-main{max-width:1080px;margin:0 auto;padding:26px 18px 80px}

    /* ---- Toasts ---- */
    #wk-toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:4000;display:flex;flex-direction:column;gap:8px;align-items:center}
    .wk-toast{display:flex;align-items:center;gap:9px;background:var(--bg-card);border:1px solid var(--border-color);border-left:3px solid var(--purple-accent);color:var(--text-main);border-radius:12px;padding:11px 16px;font:600 13px Inter,sans-serif;box-shadow:0 14px 40px rgba(0,0,0,.55);animation:wk-in .25s ease}
    .wk-toast.err{border-left-color:#ef4444}
    .wk-toast.ok{border-left-color:#22c55e}
    @keyframes wk-in{from{opacity:0;transform:translateY(10px)}}

    @media (max-width:720px){
        .wk-header{gap:9px;padding:0 12px}
        .wk-brand .wk-txt{display:none}
        .wk-back span{display:none}
        #wk-main{padding:18px 12px 70px}
    }
</style>
</head>
<body>

<!-- Arranque: se apaga cuando el Core pinta el primer bloque -->
<div id="wk-boot" aria-live="polite">
    <div class="wk-boot-logo">Stevscon<span>.wiki</span></div>
    <span class="wk-boot-spin"></span>
    <div class="wk-boot-hint">Abriendo la wiki…</div>
    <div class="wk-boot-error" id="wk-boot-error"></div>
</div>

<!-- ==== Header fijo ==== -->
<header class="wk-header">
    <div class="wk-brand" id="wk-home-btn" title="Portada de la wiki">
        <img src="/SC-LOGO-20260825013121.png" alt="SC" onerror="this.style.display='none'">
        <span class="wk-txt">Stevscon<span class="wk-tld">.wiki</span></span>
    </div>
    <div class="wk-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="wk-search" type="text" placeholder="Buscar en la wiki…" autocomplete="off">
    </div>
    <button type="button" class="wk-back" id="wk-back-btn">
        <i class="fa-solid fa-arrow-left"></i><span>Stevscon.com</span>
    </button>
</header>

<!-- ==== Barra de categorías (la llena el Core) ==== -->
<nav id="wk-catnav" aria-label="Categorías de la wiki"></nav>

<!-- ==== Contenido ==== -->
<main id="wk-main"></main>

<!-- ==== Toasts ==== -->
<div id="wk-toasts"></div>

<!-- ==== FIREBASE (compat 8, el mismo stack de tu social.html) ==== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-auth.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-database.min.js"></script>
<script>
    /* Tu MISMA config real de firebase_data.js — sin placeholders */
    window.StevsconFirebaseConfig = {
        apiKey: "AIzaSyAJN6uAVY65MAXJW1_0aHHP0L5okE9Tytw",
        authDomain: "stevscon-protocole-base.firebaseapp.com",
        databaseURL: "https://stevscon-protocole-base-default-rtdb.firebaseio.com",
        projectId: "stevscon-protocole-base",
        storageBucket: "stevscon-protocole-base.firebasestorage.app",
        messagingSenderId: "308982842818",
        appId: "1:308982842818:web:4205b4d49c7347898d825b",
        measurementId: "G-X93QHQYQPM"
    };
    try { if (!firebase.apps.length) firebase.initializeApp(window.StevsconFirebaseConfig); }
    catch (e) { console.warn('[Wiki] Firebase no inicializado:', e && e.message); }

    /* Toast global de la wiki (los módulos lo usan) */
    window.StevsconWiki = window.StevsconWiki || {};
    window.StevsconWiki.toast = function (msg, kind) {
        var wrap = document.getElementById('wk-toasts');
        if (!wrap) return;
        var t = document.createElement('div');
        t.className = 'wk-toast' + (kind === 'error' ? ' err' : kind === 'ok' ? ' ok' : '');
        var ic = document.createElement('i');
        ic.className = kind === 'error' ? 'fa-solid fa-circle-exclamation' : kind === 'ok' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-info';
        var sp = document.createElement('span');
        sp.textContent = msg;
        t.appendChild(ic); t.appendChild(sp);
        wrap.appendChild(t);
        setTimeout(function () {
            t.style.opacity = '0'; t.style.transition = 'opacity .3s';
            setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 320);
        }, 4200);
    };
</script>

<!-- ==== CANDADO DE BANS (igual que social.html, después de Firebase) ==== -->
<script src="/banned.js?v=2"></script>

<!-- ==== Dispatcher de perfiles (avatar/nombre del autor abre tu panel) ==== -->
<script src="/social/manage/output/system/profiles_show.js?v=7"></script>

<!-- ==== MOTOR DE LA WIKI (orden estricto: core -> system -> page -> manage) ==== -->
<script src="/wiki/manage/output/wiki_core.js?v=1"></script>
<script src="/wiki/manage/output/wiki_system.js?v=1"></script>
<script src="/wiki/manage/pages/wiki_page.js?v=1"></script>
<script src="/wiki/manage/output/wiki_manage.js?v=1"></script>

<script>
(function () {
    'use strict';
    /* ====
       Arranque de wiki.html:
       1) Espera al motor (core + system + page)
       2) WK.boot() monta la portada y rutea deep links
       3) 'sc:wiki-ready' apaga la pantalla de arranque
       4) Perfiles: si el panel no está conectado, toast amable
       ==== */
    var boot = document.getElementById('wk-boot');
    var t0 = Date.now();

    /* Fallback del panel de perfiles (profiles_show dispara 'sc:open-profile') */
    document.addEventListener('sc:open-profile', function (e) {
        if (e.detail && e.detail.handled) return;
        if (e.detail) e.detail.handled = true;
        if (window.StevsconWiki && window.StevsconWiki.toast) {
            window.StevsconWiki.toast('El panel de perfiles vive en Stevscon.com', 'info');
        }
    });

    function coreReady() {
        var W = window.StevsconWiki;
        return !!(W && W.core && W.system && W.page && typeof W.boot === 'function');
    }

    function fail() {
        var box = document.getElementById('wk-boot-error');
        if (box) {
            box.textContent = 'La wiki no pudo arrancar. Revisa que existan y estén en este orden: ' +
                'wiki_core.js, wiki_system.js, wiki_page.js y wiki_manage.js (carpeta /wiki/manage/output/ y /wiki/manage/pages/).';
            box.style.display = 'block';
        }
        var spin = boot.querySelector('.wk-boot-spin');
        var hint = boot.querySelector('.wk-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Algo falló:';
    }

    var tries = 0;
    (function waitCore() {
        if (coreReady()) {
            try {
                window.StevsconWiki.boot();
                document.addEventListener('sc:wiki-ready', function () {
                    if (boot) boot.style.display = 'none';
                });
            } catch (e) {
                console.error('[Wiki] boot():', e); fail();
            }
            return;
        }
        if (++tries > 75) return fail();   /* 15 s y nada -> error visible */
        setTimeout(waitCore, 200);
    })();
})();
</script>
</body>
</html>
