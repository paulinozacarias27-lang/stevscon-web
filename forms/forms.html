<!--
  ====
  STEVSCON.COM — forms/forms.html (v1)
  Página HTML propia de APOSTULACIONES.
  URL: https://www.stevscon.com/forms/forms.html

  ESTRUCTURA EXACTA del repo (como está en tu carpeta forms/):

  forms/
  ├─ panel/
  │  ├─ admin/
  │  │  ├─ create_form/    ← el CREADOR: panels, sub_panels,
  │  │  │                     editor_panels, editor_sub_panels,
  │  │  │                     form_main_panel, submit_form_panels,
  │  │  │                     view_panel (7 files)
  │  │  ├─ data_save/      ← gmail_profile, public_forms,
  │  │  │                     data_panel, accept_decline (4 files)
  │  │  └─ create_button.js ← el botón de la esquina (Owner/Admins)
  │  └─ public/            ← main_panel, see_form, submit_form
  │                          y connect_form (el CONECTADOR)
  ├─ category_forms.js     ← la puerta desde el index
  ├─ fonts.js              ← tipografía (Inter + Font Awesome)
  ├─ forms_core.js         ← helper base: namespace FM + helpers
  └─ forms.html            ← este file

  CÓMO FUNCIONA (misma arquitectura que social.html):
  - Este file NO dibuja nada de las Apostulaciones por sí mismo.
  - Carga el stack de /forms/panel/ en orden y le pasa el mando a
    connect_form.js (el CONECTADOR, SIEMPRE el último script —
    tu regla de siempre: coordinador al final), que monta TODO:
    tarjetas, ver form, postularse, mis apostulaciones y el panel
    de revisión del staff.
  - Un formulario = paneles principales (categorías) + sub-paneles
    (las preguntas). Una respuesta por usuario; si te RECHAZAN,
    puedes volverte a postular.
  - Deep links:  /forms/forms.html#form/{formId}
                 /forms/forms.html#mis
                 /forms/forms.html#staff   (solo Owner/Admins)

  FIREBASE: cero config aquí — carga el firebase_data.js de la raíz
  (el MISMO del index). Si solo expone el config, se inicializa solo.

  TEMA: mismo sistema que social (data-theme + localStorage + Firebase).
  MOVE: la barra de scroll del sitio (/social/move.js v2).

  ROLLOUT POR PARTES: mientras no existan los files de panel/, la
  página muestra un aviso de "en construcción" (NUNCA un error rojo
  en la web pública). Cuando subas las partes 2, 3 y 4 arranca sola —
  este HTML no se vuelve a tocar (solo subes el ?v= de un file
  cuando lo actualices).
  ====
-->

        }
    } catch (e) { console.warn('[Forms] Firebase config:', e && e.message); }
    /* Namespace de Apostulaciones garantizado desde el arranque */

</script>

<script>
/* TEMA · al iniciar sesión, manda el guardado en Firebase (Preferencias) */
firebase.auth().onAuthStateChanged(function (u) {
    if (!u || !firebase.database) return;
    firebase.database().ref('users/' + u.uid + '/settings/theme').once('value').then(function (s) {
        var t = s.val();
        if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            try { localStorage.setItem('stevscon_theme', t); } catch (e) {}
        }
    }).catch(function () {});
});
</script>

<script>
(function () {
    'use strict';
    /* ====
       Arranque de forms.html:
       1) Espera al CONECTADOR (connect_form.js expone FM.connect.mount)
       2) Espera a que Auth resuelva la sesión (o invitado)
       3) FM.connect.mount(user) monta TODA la página dentro de #fm-root
       4) Primer pintado -> se apaga la pantalla de carga -> rutea el hash
       5) Deep links: #form/{id} · #mis · #staff
       6) ROLLOUT: si forms_core.js cargó pero el conector no existe
          todavía (partes 2-4 sin subir), muestra "en construcción" —
          nunca un error rojo en la web pública.
       ==== */
    var boot = document.getElementById('sc-boot');

    function coreReady() {
        var F = window.StevsconForms;
        return !!(F && F.connect && typeof F.connect.mount === 'function');
    }
    function coreOnly() {
        var F = window.StevsconForms;
        return !!(F && F.core);
    }

    function fail() {
        var box = document.getElementById('sc-boot-error');
        if (box) {
            box.textContent = 'Las Apostulaciones no pudieron arrancar. Revisa que existan y se carguen EN ORDEN: ' +
                '/forms/fonts.js y /forms/forms_core.js, los 7 de /forms/panel/admin/create_form/, los 4 de /forms/panel/admin/data_save/, ' +
                '/forms/panel/admin/create_button.js, los 3 públicos de /forms/panel/public/ y /forms/panel/public/connect_form.js (el conector, siempre el último). ' +
                'Pulsa F12 > Console/Network para ver qué file falló (404).';
            box.style.display = 'block';
        }
        var spin = boot.querySelector('.sc-boot-spin');
        var hint = boot.querySelector('.sc-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Algo falló:';
    }

    function soon() {
        var spin = boot.querySelector('.sc-boot-spin');
        var hint = boot.querySelector('.sc-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Muy pronto';
        var box = document.getElementById('sc-boot-error');
        if (box) {
            box.textContent = 'Las Apostulaciones están en construcción — los módulos de panel/ todavía no se publican. Vuelve pronto; mientras tanto puedes volver al inicio.';
            box.style.display = 'block';
            box.style.borderColor = 'rgba(139,92,246,.4)';
            box.style.background = 'rgba(139,92,246,.08)';
            box.style.color = 'var(--text-main,#f8fafc)';
        }
        var back = document.createElement('a');
        back.href = '/';
        back.textContent = '← Volver a Stevscon.com';
        back.style.cssText = 'color:var(--purple-accent,#8b5cf6);text-decoration:none;font-weight:700;font-size:14px';
        boot.appendChild(back);
    }

    /* Auth resuelto (sesión guardada o invitado) con tope de 3.5s */
    function warmAuth(cb) {
        try {
            var a = firebase.auth();
            if (a.currentUser) { cb(a.currentUser); return; }
            var done = false;
            var off = a.onAuthStateChanged(function (u) {
                if (done) return;
                done = true;
                try { if (off) off(); } catch (e) {}
                cb(u || null);
            });
            setTimeout(function () {
                if (!done) { done = true; try { if (off) off(); } catch (e) {} cb(null); }
            }, 3500);
        } catch (e) { cb(null); }
    }

    /* Espera (tope 6s) al primer pintado del conector dentro de #fm-root */
    function waitFirstPaint(cb) {
        var n = 0;
        (function look() {
            var root = document.getElementById('fm-root');
            if ((root && root.childElementCount > 0) || n >= 30) return cb();
            n++; setTimeout(look, 200);
        })();
    }

    function hideBoot() {
        if (!boot) return;
        boot.style.transition = 'opacity .25s ease';
        boot.style.opacity = '0';
        setTimeout(function () { boot.style.display = 'none'; }, 260);
    }

    function bootFlow() {
        warmAuth(function (u) {
            try { window.StevsconForms.connect.mount(u || null); }
            catch (e) { console.error('[Forms] mount():', e); fail(); return; }
            waitFirstPaint(function () { hideBoot(); route(); });
        });
    }

    var tries = 0;
    (function waitCore() {
        if (coreReady()) { bootFlow(); return; }
        tries++;
        /* core cargó pero el conector no -> módulos aún sin publicar */
        if (tries > 30 && coreOnly()) return soon();
        if (tries > 75) return coreOnly() ? soon() : fail();   /* 15s y nada */
        setTimeout(waitCore, 200);
    })();

    /* Rutas -> el CONECTADOR decide qué abrir (#form/{id} · #mis · #staff) */
    function route() {
        var F = window.StevsconForms;
        try { if (F && F.connect && typeof F.connect.route === 'function') F.connect.route(location.hash || ''); }
        catch (e) { console.error('[Forms] route():', e); }
    }
    window.addEventListener('hashchange', route);
})();
</script>
