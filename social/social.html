<!DOCTYPE html>
<!--
  ====
  STEVSCON.COM — social/social.html (v3)
  Página HTML propia de la categoría Social.
  URL: https://www.stevscon.com/social/social.html

  CÓMO FUNCIONA (sin sistemas inventados):
  - Este file NO dibuja nada del Social por sí mismo.
  - Carga tu stack real y le pasa el mando a category_posts.js
    (que vive en social/manage/posts/, igual que en tu index),
    el cual monta TODO: composer de staff + feed en tiempo real.
  - Al entrar, el Social se abre solo (SCSOC.pages.open()).
  - "Volver" y Escape te regresan al inicio (la URL cambia de
    /social/social.html -> /), como una web de varios HTML.
  - Deep links:  /social/social.html#post/{postId}
                 /social/social.html#u/{handler}

  FIREBASE: no se pega NADA de config aquí — carga tu firebase_data.js
  de la raíz (el MISMO que usa el index). Si ese file solo expone el
  config sin inicializar, este HTML lo inicializa solo.

  NOTA: aquí NO se carga category_social.js — esa pestaña es la PUERTA
  desde la web principal hacia este HTML (patch aparte en ese file).
  ====
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0b14">
<title>Social — Stevscon</title>

<link rel="icon" type="image/png" href="/SC-LOGO-20260825013121.png">
<link rel="apple-touch-icon" href="/SC-LOGO-20260825013121.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* Mismas variables que usa tu sistema (category_posts.js las hereda de aquí) */
    :root{
        --bg-main:#0d0b14; --border-color:#2e2440; --bg-hover:#261f36;
        --purple-accent:#8b5cf6; --purple-dark:#6d28d9; --purple-glow:rgba(139,92,246,.35);
        --text-main:#f8fafc; --text-muted:#94a3b8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--bg-main);color:var(--text-main);font-family:Inter,system-ui,sans-serif;min-height:100vh}

    /* ---- Pantalla de arranque (se ve un segundo mientras carga el motor) ---- */
    #sc-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg-main);z-index:100}
    #sc-boot .sc-boot-logo{font-size:26px;font-weight:800;letter-spacing:-.02em}
    #sc-boot .sc-boot-logo span{color:var(--purple-accent)}
    #sc-boot .sc-boot-hint{color:var(--text-muted);font-size:13px;font-weight:600}
    .sc-boot-spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--bg-hover);border-top-color:var(--purple-accent);animation:sc-boot-spin .7s linear infinite}
    @keyframes sc-boot-spin{to{transform:rotate(360deg)}}
    #sc-boot .sc-boot-error{display:none;max-width:540px;margin:0 20px;border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.08);color:#f87171;border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;line-height:1.6}

    /* ---- Destello del post llegado por deep link ---- */
    .scsoc-post-flash{animation:scsocFlash 1.1s ease-in-out 2}
    @keyframes scsocFlash{50%{box-shadow:0 0 0 3px var(--purple-glow)}}
</style>
</head>
<body>

<!-- Arranque: se apaga solo cuando el Social abre -->
<div id="sc-boot" aria-live="polite">
    <div class="sc-boot-logo">Stevscon<span>.</span></div>
    <span class="sc-boot-spin"></span>
    <div class="sc-boot-hint">Abriendo el Social…</div>
    <div class="sc-boot-error" id="sc-boot-error"></div>
</div>

<!-- ==== FIREBASE · SDK compat 9.23.0, LOS MISMOS de tu index ==== -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<!-- ==== CONFIG · tu firebase_data.js de la raíz (el MISMO del index). Cero pegar configs. ==== -->
<script src="/firebase_data.js?v=13"></script>
<script>
    /* Defensa: si firebase_data.js solo expone el config (window.StevsconFirebase)
       y no llama a initializeApp, lo inicializamos aquí. Si ya inicializó, no se toca. */
    try {
        if (typeof firebase !== 'undefined' && !firebase.apps.length &&
            window.StevsconFirebase && window.StevsconFirebase.apiKey) {
            firebase.initializeApp(window.StevsconFirebase);
        }
    } catch (e) { console.warn('[Social] Firebase config:', e && e.message); }
</script>

<!-- ==== TU STACK REAL (mismas rutas ABSOLUTAS, orden y versiones que tu index) ==== -->
<script src="/social/manage/output/system/numbers.js?v=2"></script>
<script src="/social/manage/output/advanced_system/utils.js?v=6"></script>
<script src="/social/manage/output/advanced_system/verified.js?v=2"></script>
<script src="/social/manage/output/system/likes.js?v=2"></script>
<script src="/social/manage/output/system/comments.js?v=2"></script>
<script src="/social/manage/output/system/responses.js?v=5"></script>
<!-- EDIT · editar/eliminar (posts SOLO staff; comentarios para todos) -->
<script src="/social/manage/output/edit/edit_post/edit.js?v=2"></script>
<script src="/social/manage/output/edit/edit_post/remove.js?v=2"></script>
<script src="/social/manage/output/edit/edit_comment/edit.js?v=2"></script>
<script src="/social/manage/output/edit/edit_comment/remove.js?v=3"></script>
<script src="/social/manage/output/system/profiles_show.js?v=6"></script>
<script src="/social/manage/output/advanced_system/admin_post.js?v=5"></script>
<!-- EL MOTOR: category_posts.js monta la página Social completa.
     Ruta REAL (según tu árbol y tu index): social/manage/posts/ -->
<script src="/social/manage/posts/category_posts.js?v=2"></script>
<script src="/social/manage/posts/category_social.js?v=2"></script>

<script>
(function () {
    'use strict';
    /* ====
       Arranque de social.html:
       1) Espera al motor (category_posts.js + admin_post.js)
       2) Abre el Social solo -> SCSOC.pages.open()
       3) sc:social-closed -> regreso al inicio (web de varios HTML)
       4) Deep links: #post/{id} y #u/{handler}
       ==== */
    var boot = document.getElementById('sc-boot');

    function coreReady() {
        return !!(window.SCSOC && window.SCSOC.pages && typeof window.SCSOC.pages.open === 'function' &&
                  window.SCSOC.posts && typeof window.SCSOC.posts.mountFeed === 'function');
    }

    function fail() {
        var box = document.getElementById('sc-boot-error');
        if (box) {
            box.textContent = 'El Social no pudo arrancar. Revisa que existan y se carguen EN ORDEN: ' +
                'numbers.js, utils.js, verified.js, likes.js, comments.js, responses.js, edit (post y comment), ' +
                'profiles_show.js, admin_post.js y social/manage/posts/category_posts.js. ' +
                'Pulsa F12 > Console/Network para ver qué file falló (404).';
            box.style.display = 'block';
        }
        var spin = boot.querySelector('.sc-boot-spin');
        var hint = boot.querySelector('.sc-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Algo falló:';
    }

    /* 1) + 2) esperar al motor y abrir */
    var tries = 0;
    (function waitCore() {
        if (coreReady()) {
            try { window.SCSOC.pages.open(); }
            catch (e) { console.error('[Social] open():', e); fail(); return; }
            if (boot) boot.style.display = 'none';
            route();
            return;
        }
        if (++tries > 75) return fail();   /* 15 s y nada -> error visible */
        setTimeout(waitCore, 200);
    })();

    /* 3) Volver / Escape cierran la capa -> URL cambia de vuelta al inicio */
    document.addEventListener('sc:social-closed', function () { location.href = '/'; });

    /* 4) Deep links */
    function route() {
        var h = (location.hash || '').replace(/^#\/?/, '');
        if (h.indexOf('post/') === 0) return openPost(h.slice(5));
        if (h.indexOf('u/') === 0) return openUser(h.slice(2).toLowerCase());
    }

    function openPost(id) {
        if (!id) return;
        var n = 0;
        (function find() {
            var el = document.querySelector('[data-scsoc-post="' + id + '"], [data-post-id="' + id + '"]');
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('scsoc-post-flash');
                setTimeout(function () { el.classList.remove('scsoc-post-flash'); }, 2600);
                return;
            }
            if (++n < 40) setTimeout(find, 400);   /* el feed carga en tiempo real */
        })();
    }

    function openUser(q) {
        if (!q || !window.firebase || !firebase.database) return;
        firebase.database().ref('handlers/' + q).once('value').then(function (s) {
            var uid = s.val() || q;
            var probe = document.createElement('span');
            probe.style.display = 'none';
            probe.setAttribute('data-scsoc-profile', uid);
            document.body.appendChild(probe);
            probe.click();
            setTimeout(function () { if (probe.parentNode) probe.parentNode.removeChild(probe); }, 400);
        }).catch(function () {});
    }

    window.addEventListener('hashchange', route);
})();
</script>
</body>
</html>
