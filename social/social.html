  - Este file NO dibuja nada del Social por sí mismo.
  - Carga tu stack real y le pasa el mando a category_posts.js
    (que vive en social/manage/posts/, igual que en tu index),
    el cual monta TODO: composer de staff + feed en tiempo real.
  - Al entrar, el Social se abre solo (SCSOC.pages.open()).
  - "Volver" y Escape te regresan al inicio (la URL cambia de
    /social/social.html -> /), como una web de varios HTML.

                 /social/social.html#u/{handler}

  de la raíz (el MISMO que usa el index). Si ese file solo expone el

  NOTA: aquí NO se carga category_social.js — esa pestaña es la PUERTA
  desde la web principal hacia este HTML (patch aparte en ese file).
  ====
-->

(function () {
    var t = 'dark';
    try { t = localStorage.getItem('stevscon_theme') || 'dark'; } catch (e) {}
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    document.addEventListener('sc:theme-applied', function (e) {
        var v = (e && e.detail && e.detail.theme) || 'dark';
        document.documentElement.setAttribute('data-theme', v);
        try { localStorage.setItem('stevscon_theme', v); } catch (er) {}
    });
})();
</script>
<script>
/* TEMA · al iniciar sesión, manda el guardado en Firebase (Preferencias) */
firebase.auth().onAuthStateChanged(function (u) {
    if (!u || !firebase.database) return;
    firebase.database().ref('users/' + u.uid + '/settings/theme').once('value').then(function (s) {
        var t = s.val();
        if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            try { localStorage.setItem('stevscon_theme', t); } catch (e) {}
        }
    }).catch(function () {});
});
</script>

<script>
(function () {
    'use strict';
    /* ====
       Arranque de social.html (v2 — TODO listo antes de mostrar):
       1) Espera al motor (category_posts.js + admin_post.js)
       2) Espera a que Auth resuelva la sesión (o invitado)
       3) Abre el Social (SCSOC.pages.open()) MANTENIENDO la pantalla
          de carga hasta que el feed pinte su primer post (o el vacío)
          -> NUNCA se ve el Social a medio armar. Cero refresh.
       4) sc:social-closed -> regreso al inicio (web de varios HTML)
       5) Deep links: #post/{id} y #u/{handler}
       ==== */
    var boot = document.getElementById('sc-boot');

    function coreReady() {
        return !!(window.SCSOC && window.SCSOC.pages && typeof window.SCSOC.pages.open === 'function' &&
                  window.SCSOC.posts && typeof window.SCSOC.posts.mountFeed === 'function');
    }

    function fail() {
        var box = document.getElementById('sc-boot-error');
        if (box) {
            box.textContent = 'El Social no pudo arrancar. Revisa que existan y se carguen EN ORDEN: ' +
                'numbers.js, utils.js, verified.js, likes.js, comments.js, responses.js, edit (post y comment), ' +
                'profiles_show.js, admin_post.js y social/manage/posts/category_posts.js. ' +
                'Pulsa F12 > Console/Network para ver qué file falló (404).';
            box.style.display = 'block';
        }
        var spin = boot.querySelector('.sc-boot-spin');
        var hint = boot.querySelector('.sc-boot-hint');
        if (spin) spin.style.display = 'none';
        if (hint) hint.textContent = 'Algo falló:';
    }

    /* Auth resuelto (sesión guardada o invitado) con tope de 3.5s */
    function warmAuth(cb) {
        try {
            var a = firebase.auth();
            if (a.currentUser) { cb(a.currentUser); return; }
            var done = false;
            var off = a.onAuthStateChanged(function (u) {
                if (done) return;
                done = true;
                try { if (off) off(); } catch (e) {}
                cb(u || null);
            });
            setTimeout(function () {
                if (!done) { done = true; try { if (off) off(); } catch (e) {} cb(null); }
            }, 3500);
        } catch (e) { cb(null); }
    }

    /* Espera (con tope de 6s) al primer post pintado o al estado vacío */
    function waitFirstPaint(cb) {
        var n = 0;
        (function look() {
            var any = document.querySelector('[data-scsoc-post]') ||
                (document.body.textContent || '').indexOf('No hay publicaciones todavía.') !== -1;
            if (any || n >= 30) return cb();   /* 30 x 200ms = 6s tope */
            n++; setTimeout(look, 200);
        })();
    }

    function hideBoot() {
        if (!boot) return;
        boot.style.transition = 'opacity .25s ease';
        boot.style.opacity = '0';
        setTimeout(function () { boot.style.display = 'none'; }, 260);
    }

    function bootFlow() {
        warmAuth(function (u) {
            /* Calienta TU nodo: avatar/status listos al primer frame */
            if (u && window.SCSOC && SCSOC.users && SCSOC.users.get) {
                try { SCSOC.users.get(u.uid, function () {}); } catch (e) {}
            }
            try { window.SCSOC.pages.open(); }
            catch (e) { console.error('[Social] open():', e); fail(); return; }
            waitFirstPaint(function () { hideBoot(); route(); });
        });
    }

    var tries = 0;
    (function waitCore() {
        if (coreReady()) { bootFlow(); return; }
        if (++tries > 75) return fail();   /* 15 s y nada -> error visible */
        setTimeout(waitCore, 200);
    })();

    /* Volver / Escape cierran la capa -> URL cambia de vuelta al inicio */
    document.addEventListener('sc:social-closed', function () { location.href = '/'; });

    /* Deep links */
    function route() {
        var h = (location.hash || '').replace(/^#\/?/, '');
        if (h.indexOf('post/') === 0) return openPost(h.slice(5));
        if (h.indexOf('u/') === 0) return openUser(h.slice(2).toLowerCase());
    }

    function openPost(id) {
        if (!id) return;
        var n = 0;
        (function find() {
            var el = document.querySelector('[data-scsoc-post="' + id + '"], [data-post-id="' + id + '"]');
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.classList.add('scsoc-post-flash');
                setTimeout(function () { el.classList.remove('scsoc-post-flash'); }, 2600);
                return;
            }
            if (++n < 40) setTimeout(find, 400);   /* el feed carga en tiempo real */
        })();
    }

    function openUser(q) {
        if (!q || !window.firebase || !firebase.database) return;
        firebase.database().ref('handlers/' + q).once('value').then(function (s) {
            var uid = s.val() || q;
            var probe = document.createElement('span');
            probe.style.display = 'none';
            probe.setAttribute('data-scsoc-profile', uid);
            document.body.appendChild(probe);
            probe.click();
            setTimeout(function () { if (probe.parentNode) probe.parentNode.removeChild(probe); }, 400);
        }).catch(function () {});
    }

    window.addEventListener('hashchange', route);
})();
</script>
