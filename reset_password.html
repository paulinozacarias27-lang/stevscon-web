<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stevscon · Recuperar contraseña</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0b14;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
    <p style="color:#a78bfa;font-size:14px;">Abriendo Stevscon…</p>
    <script>
        (function () {
            try {
                var params = new URLSearchParams(window.location.search || '');
                params.set('reset', '1');
                window.location.replace('/?' + params.toString());
            } catch (e) {
                window.location.replace('/?reset=1');
            }
        })();
    </script>
</body>
</html>
